name: SumarteRedMonitor
options:
  bundleIdPrefix: com.sumartered
  deploymentTarget:
    macOS: "13.0"          # ScreenCaptureKit audio requiere macOS 13+
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: SumarteRedMonitor
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES

targets:
  SumarteRedMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - sdk: ServiceManagement.framework
      - sdk: ScreenCaptureKit.framework
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: SumarteRed Monitor
        CFBundleDisplayName: SumarteRed Monitor
        CFBundleIdentifier: com.sumartered.monitor
        CFBundleVersion: "3"
        CFBundleShortVersionString: "3.0.0"
        CFBundleIconFile: AppIcon
        LSUIElement: true
        NSScreenCaptureUsageDescription: "SumarteRed Monitor captura el audio del sistema para identificar las canciones reproducidas y reportar los plays correctamente."
        LSMinimumSystemVersion: "13.0"
        NSPrincipalClass: NSApplication
    entitlements:
      path: Sources/SumarteRed.entitlements
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/SumarteRed.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.sumartered.monitor
